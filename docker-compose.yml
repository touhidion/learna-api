# Development stack.
#
# The database is Neon (serverless Postgres), so no database container is
# started by default — the API reads DATABASE_URL from .env.development.
#
#   docker compose up -d --build
#   curl localhost:8081/health
#
# A local Postgres is still available for offline work, behind a profile so it
# never starts unless asked for:
#
#   docker compose --profile local-db up -d
#   # then point DATABASE_URL at it:
#   #   postgresql://learna:learna@postgres:5432/learna?sslmode=disable
#
# The UI runs from ../learna-ui on port 3100 (dev) or 3200 (prod).

name: learna

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learna-api
    restart: unless-stopped

    # Every value comes from the same file the bare-metal `go run` reads, so
    # the two cannot drift. It is gitignored and holds the Neon credential.
    env_file:
      - .env.development

    environment:
      # The image defaults to production; compose runs the dev profile.
      APP_ENV: development
      # Bind inside the container on the port the Dockerfile exposes,
      # regardless of what SERVER_PORT says in the env file.
      SERVER_PORT: 8082

    ports:
      # Published on the dev port; container listens on 8082.
      - "8081:8082"

    networks:
      - learna

    # Only waited on when the local-db profile is active. With Neon there is
    # no container to wait for, and a missing optional dependency is ignored.
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    # Opt-in: `docker compose --profile local-db up -d`
    profiles: ["local-db"]
    image: postgres:16-alpine
    container_name: learna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-learna}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-learna}
      POSTGRES_DB: ${DB_NAME:-learna}
      # Deterministic collation, so ORDER BY does not vary by host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Must mean "ready for queries", not merely "process started".
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-learna} -d ${DB_NAME:-learna}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - learna

volumes:
  postgres_data:

networks:
  learna:
    driver: bridge
