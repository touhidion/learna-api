# Development stack: Postgres plus the API.
#
#   cp .env.example .env   # then set JWT_SECRET
#   docker compose up -d
#   curl localhost:8080/health
#
# The UI runs from ../learna-ui and talks to http://localhost:8080.

name: learna

services:
  postgres:
    image: postgres:16-alpine
    container_name: learna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-learna}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-learna}
      POSTGRES_DB: ${DB_NAME:-learna}
      # Deterministic collation, so ORDER BY does not vary by host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The API waits on this, so it must mean "ready for queries", not just
      # "process started".
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-learna} -d ${DB_NAME:-learna}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - learna

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learna-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SERVER_PORT: 8080

      # Inside the compose network the database is reachable by service name,
      # regardless of what DB_HOST says for host-side tooling.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-learna}
      DB_PASSWORD: ${DB_PASSWORD:-learna}
      DB_NAME: ${DB_NAME:-learna}
      DB_SSLMODE: disable
      DB_AUTO_MIGRATE: "true"

      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@learna.local}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-ChangeMe123!}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}

      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-learna}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - learna

volumes:
  postgres_data:

networks:
  learna:
    driver: bridge
